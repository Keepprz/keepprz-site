<!doctype html>
<html lang="en">
<head>
<!-- capture_recorder_v01 · v1.2 2026-11-03 (a take counts as saved only once Jason says it arrived) · Talking-head recorder: one shot fitted to one white screen, front camera.
     The list: the highest capture_shotlist_vNN.json (named in capture_takes_v01.js). Tap a shot, the camera opens on its script; Record, Stop, Good, back to the
     list with the shot green. Green and the takes live on this phone (capture_takes_v01.js) until the list's
     Save button sends them to Photos, then the iPhone cable route takes them off the phone.
     Tested settings: 4K, 25 Mbps (take of 2026-11-03). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Capture Recorder</title>
<style>
  /* One-look page: white on purpose, because the screen is the light on his face. */
  :root {
    color-scheme: light;
    --light: #ffffff; --ink: #111418; --muted: #5d6670; --line: #d5dae0; --rec: #d92d20; --good: #1a7f4b;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--light); color: var(--ink); font-family: var(--sans); }
  body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
         padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
  section { display: flex; flex-direction: column; gap: 10px; height: 100%; padding-block: 8px; }
  #doneView { height: auto; min-height: 100%; }
  p { margin: 0; }
  a { color: inherit; }
  button { font: inherit; font-weight: 600; border-radius: 12px; border: 1.5px solid var(--ink); background: var(--light);
           color: var(--ink); padding: 14px 18px; min-height: 48px; cursor: pointer; }
  button.primary { background: var(--ink); color: var(--light); }
  button:focus-visible { outline: 3px solid var(--rec); outline-offset: 2px; }
  button:disabled { opacity: .4; }
  .muted { color: var(--muted); font-size: 14px; }
  #scriptBox { flex: 1 1 0; min-height: 0; overflow: hidden; }
  #scriptText { margin: 0; font-weight: 600; line-height: 1.24; white-space: pre-wrap; overflow-wrap: anywhere; }
  .stage { position: relative; display: flex; justify-content: center; align-items: center; height: 17vh; flex: none; }
  #preview { height: 100%; max-width: 100%; transform: scaleX(-1); background: var(--line); border-radius: 8px; }
  #count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 700; color: var(--rec); }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; }
  .bar a, .link { font-size: 15px; background: none; border: 0; padding: 8px 0; min-height: 40px; font-weight: 500; text-decoration: underline; }
  .sound { display: flex; align-items: center; gap: 6px; }
  .chip { padding: 6px 10px; min-height: 36px; font-size: 13px; border-radius: 9px; border-color: var(--line); font-weight: 500; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--light); border-color: var(--ink); }
  #recBtn { background: var(--rec); border-color: var(--rec); color: #fff; font-size: 20px; min-height: 58px; flex: none; font-variant-numeric: tabular-nums; }
  video#playback { width: 100%; max-height: 50vh; background: #000; border-radius: 8px; }
  .takes { display: flex; flex-wrap: wrap; gap: 6px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .wide { grid-column: 1 / -1; }
  #message { color: var(--rec); font-size: 16px; line-height: 1.4; }
  h1 { font-size: 20px; line-height: 1.2; margin: 0; }
  #setupLine { font-size: 13px; line-height: 1.25; color: var(--muted); flex: none; }
  #goodBtn { background: var(--good); border-color: var(--good); color: #fff; font-size: 22px; min-height: 66px; }
  .bar .link { flex: none; }
</style>
</head>
<body>

<section id="openView">
  <div class="bar"><a href="/capture/">‹ List</a></div>
  <h1 id="openTitle">Loading the script…</h1>
  <p id="message" hidden></p>
  <button class="primary" id="startBtn" disabled>Open the camera</button>
  <p class="muted">Turn your brightness all the way up. Allow the camera and the microphone when Safari asks.</p>
</section>

<section id="recView" hidden>
  <p id="setupLine"></p>
  <div id="scriptBox"><p id="scriptText"></p></div>
  <div class="stage"><video id="preview" playsinline muted autoplay></video><div id="count" hidden></div></div>
  <div class="bar" id="controlsBar">
    <a class="backLink" href="/capture/">‹ List</a>
    <button class="link" id="seeTakesBtn" hidden></button>
    <div class="sound" id="soundChips"></div>
  </div>
  <button id="recBtn" disabled>Record</button>
</section>

<section id="doneView" hidden>
  <div class="bar"><a class="backLink" href="/capture/">‹ List</a><span class="muted" id="doneTitle"></span></div>
  <video id="playback" playsinline controls></video>
  <div class="takes" id="takeChips"></div>
  <p class="muted" id="takeFacts"></p>
  <div class="actions">
    <button class="wide" id="goodBtn">Good</button>
    <button class="wide" id="retakeBtn">Another take</button>
  </div>
  <div class="bar">
    <button class="link" id="notGoodBtn" hidden>Not good after all</button>
    <button class="link" id="saveBtn">Save this take to Photos now</button>
  </div>
  <p class="muted" id="doneNote"></p>
  <div class="actions" id="landedRow" hidden>
    <button id="landedYes">Yes, I can see it</button>
    <button id="landedNo">No</button>
  </div>
</section>

<script src="/capture/capture_takes_v01.js"></script>
<script>
"use strict";
const SIZE = { w: 3840, h: 2160, fps: 30 };
const MBPS = 25;
const SOUNDS = [
  { id: "Phone sound", processed: true },
  { id: "Raw sound", processed: false },
];
const MIME_CANDIDATES = ['video/mp4;codecs="avc1.640033,mp4a.40.2"', 'video/mp4;codecs="avc1.640028,mp4a.40.2"', "video/mp4", "video/webm"];

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const show = (id) => ["openView", "recView", "doneView"].forEach((v) => { $(v).hidden = v !== id; });
const mb = (bytes) => (bytes / 1048576).toFixed(0) + " MB";
const scriptId = new URLSearchParams(location.search).get("shot");
const listLink = "/capture/#shot-" + encodeURIComponent(scriptId || "");
const T = CaptureTakes;

const S = { script: null, stream: null, video: null, audio: null, rec: null, wake: null, sound: SOUNDS[0], current: null, takes: [], selected: null };
try { const kept = localStorage.getItem("capture-sound"); S.sound = SOUNDS.find((s) => s.id === kept) || SOUNDS[0]; } catch (e) {}

/* ---- fit the whole script on one screen ---- */
function fitScript() {
  const box = $("scriptBox"), text = $("scriptText");
  if (!box.clientHeight) return;
  let lo = 13, hi = 46;
  while (hi - lo > 0.5) {
    const mid = (lo + hi) / 2;
    text.style.fontSize = mid + "px";
    if (text.scrollHeight <= box.clientHeight && text.scrollWidth <= box.clientWidth) lo = mid; else hi = mid;
  }
  text.style.fontSize = lo + "px";
  box.style.overflowY = text.scrollHeight > box.clientHeight ? "auto" : "hidden";
}
addEventListener("resize", () => { if (!$("recView").hidden) fitScript(); });

/* ---- takes on this phone that still have their video ---- */
const liveTakes = async () => (await T.forScript(scriptId).catch(() => [])).filter((t) => !t.cleared).sort((a, b) => a.n - b.n);

/* ---- camera ---- */
function fail(message) { $("message").textContent = message; $("message").hidden = false; show("openView"); }
function explain(e) {
  if (e.name === "NotAllowedError") return "The camera or microphone is blocked. In Settings, open Safari, set Camera and Microphone to Allow, then reload this page.";
  if (e.name === "NotFoundError") return "This device did not offer a front camera and a microphone.";
  if (e.name === "NotReadableError") return "Another app is using the camera. Close it, then reload this page.";
  return "The camera did not start: " + e.name + ". " + e.message;
}
async function askWake() {
  try { if (navigator.wakeLock) S.wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}
const audioAsk = () => {
  const on = S.sound.processed;
  return { channelCount: { ideal: 1 }, echoCancellation: on, noiseSuppression: on, autoGainControl: on };
};

function renderSound() {
  const host = $("soundChips");
  host.textContent = "";
  SOUNDS.forEach((s) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = s.id;
    b.setAttribute("aria-pressed", String(s === S.sound));
    b.onclick = async () => {
      S.sound = s;
      try { localStorage.setItem("capture-sound", s.id); } catch (e) {}
      renderSound();
      if (S.audio) { try { await S.audio.applyConstraints(audioAsk()); } catch (e) {} }
    };
    host.appendChild(b);
  });
}

async function startCamera() {
  $("message").hidden = true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fail("This browser cannot reach the camera from a page. Open this link in Safari.");
  if (typeof MediaRecorder === "undefined") return fail("This browser cannot record from a page.");
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
      audio: audioAsk(),
    });
  } catch (e) { return fail(explain(e)); }
  S.video = S.stream.getVideoTracks()[0];
  S.audio = S.stream.getAudioTracks()[0];
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {} // ask Safari not to clear the takes
  show("recView");
  $("controlsBar").style.visibility = "";
  $("recBtn").textContent = "Record";
  $("recBtn").disabled = true;
  const earlier = await liveTakes();
  $("seeTakesBtn").hidden = !earlier.length;
  $("seeTakesBtn").textContent = earlier.length === 1 ? "1 take" : `${earlier.length} takes`;
  renderSound();
  fitScript();
  const v = $("preview");
  v.srcObject = S.stream;
  try { await v.play(); } catch (e) {}
  askWake();
  try { await S.video.applyConstraints({ facingMode: "user", width: { ideal: SIZE.w }, height: { ideal: SIZE.h }, frameRate: { ideal: SIZE.fps } }); } catch (e) {}
  await sleep(450);
  fitScript();
  $("recBtn").disabled = false;
}
function stopCamera() {
  if (S.stream) S.stream.getTracks().forEach((t) => t.stop());
  S.stream = null; S.video = null; S.audio = null;
  if (S.wake) { S.wake.release().catch(() => {}); S.wake = null; }
}

/* ---- recording ---- */
async function record() {
  const mime = MIME_CANDIDATES.find((m) => MediaRecorder.isTypeSupported(m));
  if (!mime) return fail("This browser offered no recording format.");
  $("controlsBar").style.visibility = "hidden"; // hidden, not removed, so the script does not change size
  $("recBtn").disabled = true;
  const count = $("count");
  count.hidden = false;
  for (const n of [3, 2, 1]) { count.textContent = n; await sleep(800); }
  count.hidden = true;

  const when = new Date();
  const earlier = await T.forScript(scriptId).catch(() => []);
  const n = earlier.reduce((m, t) => Math.max(m, t.n), 0) + 1;
  const take = { id: "take-" + when.getTime(), script: scriptId, n, when: when.toISOString(), mime, sound: S.sound.id, good: false, saved: false, finished: false, seconds: 0, bytes: 0 };
  const cur = S.current = { take, seq: 0, chain: Promise.resolve(), t0: performance.now(), done: false, lost: 0 };
  try { await T.put(take); } catch (e) { return fail("This phone would not store the take: " + e.name + ". Free some space, then reload."); }

  S.rec = new MediaRecorder(S.stream, { mimeType: mime, videoBitsPerSecond: MBPS * 1e6, audioBitsPerSecond: 192000 });
  S.rec.ondataavailable = (e) => {
    if (!e.data || !e.data.size) return;
    const seq = cur.seq++;
    take.bytes += e.data.size;
    cur.chain = cur.chain.then(() => T.putChunk(take.id, seq, e.data)).catch(() => { cur.lost++; });
  };
  S.rec.onstop = () => finish(cur);
  S.rec.start(1000);
  $("recBtn").disabled = false;
  const tick = () => {
    if (cur.done || S.rec.state !== "recording") return;
    const secs = (performance.now() - cur.t0) / 1000;
    $("recBtn").textContent = `Stop  ${Math.floor(secs / 60)}:${String(Math.floor(secs % 60)).padStart(2, "0")}`;
    setTimeout(tick, 250);
  };
  tick();
}

async function finish(cur) {
  cur.done = true;
  cur.take.seconds = (performance.now() - cur.t0) / 1000;
  cur.take.finished = true;
  await cur.chain;
  try { await T.put(cur.take); } catch (e) {}
  await openTakes(cur.take.id);
  if (cur.lost) $("doneNote").textContent = `The phone could not store ${cur.lost} seconds of this take, so it has gaps. Free some space and record another.`;
}

/* ---- takes view ---- */
async function openTakes(selectId) {
  stopCamera();
  S.takes = await liveTakes();
  show("doneView");
  $("doneTitle").textContent = `${S.script.code} · ${S.script.title}`;
  $("doneNote").textContent = "";
  if (!S.takes.length) { await startCamera(); return; }
  await selectTake(S.takes.find((t) => t.id === selectId) || S.takes[S.takes.length - 1]);
}

let playUrl = null;
async function selectTake(take) {
  S.selected = take;
  const blob = await T.blob(take);
  S.selectedBlob = blob;
  if (playUrl) URL.revokeObjectURL(playUrl);
  playUrl = URL.createObjectURL(blob);
  $("playback").src = playUrl;
  const host = $("takeChips");
  host.textContent = "";
  S.takes.forEach((t) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = `Take ${t.n}` + (t.good ? " · good" : "");
    b.setAttribute("aria-pressed", String(t === take));
    b.onclick = () => selectTake(t);
    host.appendChild(b);
  });
  const length = take.finished ? `${take.seconds.toFixed(0)} s · ` : "Stopped early · ";
  $("takeFacts").textContent = `${length}${mb(blob.size)} · ${take.sound}` + (take.confirmed ? " · checked in Photos" : take.saved ? " · sent, not checked yet" : "");
  $("landedRow").hidden = !take.saved || !!take.confirmed;
  $("doneNote").textContent = $("landedRow").hidden ? "" : "Open Photos and look. Is it there? If you AirDropped, check your Mac instead.";
  $("saveBtn").textContent = take.saved ? "Save this take to Photos again" : "Save this take to Photos now";
  $("notGoodBtn").hidden = !take.good;
  $("goodBtn").textContent = take.good ? "Good · back to the list" : "Good";
}

async function markGood() {
  const take = S.selected;
  take.good = true;
  $("goodBtn").disabled = true;
  try { await T.put(take); }
  catch (e) {
    $("goodBtn").disabled = false;
    $("doneNote").textContent = "This phone would not store that: " + e.name + ". Free some space and tap Good again.";
    return;
  }
  location.href = listLink;
}

async function markNotGood() {
  const take = S.selected;
  take.good = false;
  try { await T.put(take); } catch (e) {}
  S.takes = await liveTakes();
  await selectTake(S.takes.find((t) => t.id === take.id));
}

async function saveTake() {
  const take = S.selected;
  const file = new File([S.selectedBlob], T.fileName(S.script, take), { type: S.selectedBlob.type });
  try {
    if (!navigator.canShare || !navigator.canShare({ files: [file] })) throw new Error("no share sheet here");
    await navigator.share({ files: [file] });
  } catch (e) {
    if (e.name === "AbortError") return; // he closed the share sheet: nothing sent
    $("doneNote").textContent = "The share sheet did not open: " + e.message;
    return;
  }
  take.saved = true;
  try { await T.put(take); } catch (e) {}
  await selectTake(take);
}

/* the share sheet closing does not prove the file landed, so he says whether it did */
async function answerLanded(arrived) {
  const take = S.selected;
  if (arrived) take.confirmed = true; else take.saved = false;
  try { await T.put(take); } catch (e) {}
  await selectTake(take);
  $("doneNote").textContent = arrived ? "" : "Not marked as saved. Try again.";
}

/* ---- wiring ---- */
$("startBtn").onclick = startCamera;
$("recBtn").onclick = () => {
  if (S.rec && S.rec.state === "recording") {
    $("recBtn").disabled = true;
    $("recBtn").textContent = "Saving…";
    S.rec.stop();
  } else { record(); }
};
$("saveBtn").onclick = saveTake;
$("landedYes").onclick = () => answerLanded(true);
$("landedNo").onclick = () => answerLanded(false);
$("goodBtn").onclick = markGood;
$("notGoodBtn").onclick = markNotGood;
$("retakeBtn").onclick = () => { $("playback").removeAttribute("src"); S.rec = null; startCamera(); };
$("seeTakesBtn").onclick = () => openTakes();
document.querySelectorAll(".backLink").forEach((a) => { a.href = listLink; });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.stream) askWake(); });

(async function boot() {
  try {
    const list = await T.shotList();
    S.script = list.shots.find((s) => s.code === scriptId) || null;
  } catch (e) { $("openTitle").textContent = "No script loaded"; $("message").textContent = e.message; $("message").hidden = false; return; }
  if (!S.script) { $("openTitle").textContent = "That shot is not on the list"; return; }
  $("openTitle").textContent = `${S.script.code} · ${S.script.title}`;
  $("setupLine").textContent = `${S.script.code} · ${S.script.setup}`;
  $("scriptText").textContent = S.script.body;
  $("startBtn").disabled = false;
  startCamera(); // straight to the script; the button above is only for when the camera is refused
})();
</script>
</body>
</html>
